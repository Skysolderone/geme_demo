schema: spec-driven

context: |
  项目：《围杀 Siege》——2–4 人共享棋盘的回合制策略构筑游戏。
  权威设计来源：仓库根目录 `2026-09-10-siege-core-gameplay-design-v1.md`（v1.0 核心原型基准）；
  `Siege-玩法介绍-v1.docx` 为面向玩家的同规则介绍稿，规则以 md 文档为准，两者冲突时以 md 为准。

  规划约束：
  - 首轮目标是 4 人核心原型，验证玩法与数值曲线，不是上线版本。
  - 本轮规格保持"实现无关"：不指定编程语言、引擎、框架或网络协议。
    spec 描述行为与规则，design 只描述结构与边界，不写具体技术栈选型。
  - 所有规格须可被自动化测试验证；随机部分必须由对局种子可复现。
  - 统一术语（中文）：大回合 / 小回合 / 批次 / 棋串 / 气 / 覆盖 / 信物 / 势力值 /
    独占空格 / 争议格 / 参赛玩家 / 先手值。英文标识符可用 turn/round/batch/group/
    liberty/coverage/relic/power。
  - 所有连接、气、覆盖、围杀一律四邻接（上下左右），不含斜线。
  - 坐标一律使用围棋记法：列字母 A–L（跳过 I）+ 行数字（自下而上，从 1 起），
    左下角为 A1。日志、规格、错误信息与一切面向人的输出都用该记法；
    实现内部可用数值索引，但必须只有一处双向映射实现。
  - 首轮不实现：金币与付费刷新、棋子升级、固定轮数、历史积分、通用击杀奖励、
    统帅与阵营、正式联网同步与匹配、2/3 人正式地图、带入带出、完整博弈树 AI、正式美术。

  文档写作：所有 OpenSpec 产物使用中文撰写，引用设计文档时标注章节号（如"设计文档 §6.1"）。

rules:
  proposal:
    - 必须写明本 change 对应设计文档的章节范围
    - 必须列出 Non-goals（明确推迟到哪个后续 change）
    - 必须列出依赖的前置 change（若有）
  design:
    - 只描述状态模型、计算顺序与边界条件，不指定语言、框架或存储方案
    - 必须写明与其他 change 的接口契约（输入/输出/触发时机）
    - 必须列出已知歧义与设计文档未覆盖的判定，并给出建议裁决
  tasks:
    - 每个任务必须可独立验收，并附带验证方式（单元测试 / 跑局统计 / 人工检查）
    - 规则类任务必须附带至少一个来自设计文档的具体算例
